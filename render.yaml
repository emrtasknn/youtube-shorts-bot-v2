services:
  # Studio bot on a FREE web service: Telegram webhook wakes it, projects live in
  # Postgres (STUDIO_STORE=db) so nothing is lost when it sleeps. Renders run on
  # GitHub Actions (STUDIO_RENDER_MODE=github).
  - type: web
    name: youtube-shorts-bot-v2-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: TELEGRAM_ADMIN_USER_ID
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_PRIVACY_STATUS
        value: public
      - key: YOUTUBE_CATEGORY_ID
        value: "27"
      - key: PEXELS_ENABLED
        value: "true"
      - key: PEXELS_API_KEY
        sync: false
      - key: PEXELS_BASE_URL
        value: https://api.pexels.com
      - key: PEXELS_TIMEOUT_SECONDS
        value: "30"
      - key: GEMINI_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TIMEOUT_SECONDS
        value: "60"
      - key: GROQ_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_TIMEOUT_SECONDS
        value: "60"
      - key: FISH_AUDIO_ENABLED
        value: "true"
      - key: FISH_AUDIO_API_KEY
        sync: false
      - key: FISH_AUDIO_BASE_URL
        value: https://api.fish.audio
      - key: FISH_AUDIO_MODEL
        value: s2.1-pro-free
      - key: FISH_AUDIO_FORMAT
        value: mp3
      - key: FISH_AUDIO_REFERENCE_ID
        sync: false
      - key: FISH_AUDIO_TIMEOUT_SECONDS
        value: "120"
      # ---- Studio V3 ----
      - key: STUDIO_RENDER_MODE
        value: github
      - key: STUDIO_GITHUB_REPO
        value: emrtasknn/youtube-shorts-bot-v2
      - key: STUDIO_GITHUB_REF
        value: main
      - key: STUDIO_GITHUB_TOKEN
        sync: false
      - key: STUDIO_LLM
        value: groq,gemini
      - key: STUDIO_STORE
        value: db
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
    # Studio V3 bot behind a Telegram webhook; with STUDIO_STORE=db it runs
    # `alembic upgrade head` itself (Render's Docker Command has no shell, so no `&&`).
    # Only one program may receive a bot token's updates: the legacy pipeline
    # (telegram-poll / telegram-webhook) must not run with the same token.
    dockerCommand: python -m app studio-webhook
