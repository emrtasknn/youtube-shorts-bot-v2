name: Generate Custom Short

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Short konusu"
        required: true
        type: string
      language:
        description: "İçerik dili"
        required: false
        default: "tr"
        type: string
      run_key:
        description: "Opsiyonel benzersiz run key"
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shorts
          POSTGRES_USER: shorts
          POSTGRES_PASSWORD: shorts
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shorts -d shorts"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql+psycopg://shorts:shorts@localhost:5432/shorts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}\n      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}\n      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      GEMINI_ENABLED: "true"
      GROQ_ENABLED: "true"
      PEXELS_ENABLED: "true"
      FISH_AUDIO_ENABLED: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install application
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Validate required secrets
        run: |
          test -n "$GEMINI_API_KEY" || (echo "GEMINI_API_KEY is missing" && exit 1)
          test -n "$GROQ_API_KEY" || (echo "GROQ_API_KEY is missing" && exit 1)
          test -n "$PEXELS_API_KEY" || (echo "PEXELS_API_KEY is missing" && exit 1)
          test -n "$FISH_AUDIO_API_KEY" || (echo "FISH_AUDIO_API_KEY is missing" && exit 1)

      - name: Generate Short
        env:
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          RUN_KEY: ${{ inputs.run_key }}
        run: |
          set -euo pipefail
          if [ -z "$RUN_KEY" ]; then
            RUN_KEY="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          # stdout is a machine-readable JSON contract. Provider diagnostics stay on stderr.
          python -m app custom "$TOPIC" \
            --language "$LANGUAGE" \
            --run-key "$RUN_KEY" \
            --requested-by "github-actions" \
            > generation-result.json

          python - <<'PY'
          import json
          from pathlib import Path

          result_path = Path("generation-result.json")
          if not result_path.is_file() or result_path.stat().st_size == 0:
              raise SystemExit("generation-result.json is missing or empty")

          try:
              result = json.loads(result_path.read_text())
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  f"generation-result.json is not valid JSON: {exc}"
              ) from exc

          required = {
              "run_id",
              "content_id",
              "script_id",
              "output_path",
              "duration_seconds",
              "status",
          }
          missing = sorted(required - result.keys())
          if missing:
              raise SystemExit(
                  f"generation-result.json is missing required fields: {missing}"
              )

          if result["status"] != "READY_FOR_APPROVAL":
              raise SystemExit(
                  f"Unexpected generation status: {result['status']}"
              )

          output_path = Path(str(result["output_path"]))
          if output_path.is_absolute():
              raise SystemExit("Generated output_path must be relative")

          if output_path.parts[:2] != ("storage", "runs"):
              raise SystemExit(
                  f"Generated output_path is outside expected run storage: {output_path}"
              )

          if not output_path.is_file() or output_path.stat().st_size == 0:
              raise SystemExit(
                  f"Generated video is missing or empty: {output_path}"
              )

          print(f"Generation result validated: {result['run_id']}")
          print(f"Generated video: {output_path}")
          PY

      - name: Resolve generated video
        run: |
          set -euo pipefail
          VIDEO_PATH="$(python - <<'PY'
          import json
          from pathlib import Path

          print(json.loads(Path("generation-result.json").read_text())["output_path"])
          PY
          )"
          test -s "$VIDEO_PATH"
          mkdir -p storage/renders
          cp "$VIDEO_PATH" storage/renders/custom.mp4
          test -s storage/renders/custom.mp4

      - name: Validate generated video
        run: |
          set -euo pipefail
          test -s storage/renders/custom.mp4
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate             -of default=noprint_wrappers=1 storage/renders/custom.mp4
          ffprobe -v error -show_entries format=duration             -of default=noprint_wrappers=1 storage/renders/custom.mp4

      - name: Send Telegram review\n        env:\n          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}\n          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}\n        run: |\n          set -euo pipefail\n          test -n "$TELEGRAM_BOT_TOKEN" || (echo "TELEGRAM_BOT_TOKEN is missing" && exit 1)\n          test -n "$TELEGRAM_ADMIN_CHAT_ID" || (echo "TELEGRAM_ADMIN_CHAT_ID is missing" && exit 1)\n          python -m app telegram-review\n\n      - name: Upload generated Short
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: custom-short-${{ github.run_id }}
          path: |
            storage/renders/custom.mp4
            generation-result.json
          if-no-files-found: warn
          retention-days: 7
