[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="youtube-shorts-bot-v2"
version="0.1.0"
description="Provider-agnostic automated YouTube Shorts system"
requires-python=">=3.12,<3.13"
dependencies=["alembic>=1.13,<2","httpx>=0.27,<1","psycopg[binary]>=3.2,<4","pydantic>=2.7,<3","pydantic-settings>=2.2,<3","sqlalchemy>=2.0,<3"]

[project.optional-dependencies]
dev=["mypy>=1.11,<2","pytest>=8,<9","pytest-asyncio>=0.23,<1","pre-commit>=4,<5","ruff==0.16.10"]

[tool.setuptools.packages.find]
include=["app*"]

[tool.ruff]
line-length=100
target-version="py312"

[tool.ruff.lint]
select=["E","F","I","UP","B"]
ignore=["E501"]

[tool.mypy]
python_version="3.12"
strict=true
