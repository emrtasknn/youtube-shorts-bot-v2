services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shorts
      POSTGRES_USER: shorts
      POSTGRES_PASSWORD: shorts
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U shorts -d shorts"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
